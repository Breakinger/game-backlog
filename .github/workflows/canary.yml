name: Check outside sites

# Once a day: download fresh copies of every page Masterlog's parsers read and run the parser tests on them.
# A red run here means a site changed its layout (or is down) before it shows up as a blank section in the app.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # only to save the fresh copies on the fixtures-snapshot branch

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest
      - name: Download fresh copies of the pages
        run: python tests/fetch_fixtures.py
      - name: Run the parsers on them
        run: python -m pytest -q tests/test_parsers.py
      - name: Keep the copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: tests/fixtures
          retention-days: 14
      - name: Save the copies on the fixtures-snapshot branch
        if: always()
        run: |
          git config user.name "masterlog-canary"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/fx && cp -r tests/fixtures /tmp/fx
          if git fetch -q origin fixtures-snapshot; then git checkout -q -f -B fixtures-snapshot FETCH_HEAD; else git checkout -q --orphan fixtures-snapshot && git rm -rq --cached . && git clean -fdq -e tests; fi
          rm -rf fixtures && mkdir fixtures && cp /tmp/fx/wp_*.json /tmp/fx/pcgw_*.json fixtures/   # openly licensed copies only
          git add fixtures
          git commit -qm "Fresh copies of the pages Masterlog reads, $(date -u +%F)" || echo "nothing changed"
          git push -q origin fixtures-snapshot
