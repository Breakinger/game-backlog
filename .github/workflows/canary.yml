name: Check outside sites

# Once a day: download fresh copies of every page Masterlog's parsers read and run the parser tests on them.
# A red run here means a site changed its layout (or is down) before it shows up as a blank section in the app.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: pip install pytest
      - name: Download fresh copies of the pages
        run: python tests/fetch_fixtures.py
      - name: Run the parsers on them
        run: python -m pytest -q tests/test_parsers.py
      - name: Keep the copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: tests/fixtures
          retention-days: 14
