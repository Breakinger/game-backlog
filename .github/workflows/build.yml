name: Build Masterlog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stamp the version
        shell: bash
        run: echo "VERSION = \"1.0.${{ github.run_number }}\"" > app/version.py

      - name: Check the app imports
        run: python -c "import sys; sys.path.insert(0, 'app'); import sheet, art, info, igdb, updater, vault, accounts, youtube, feeds, deals, modpacks, twitch, saver, names, main, version; print('imports ok', version.VERSION)"

      - name: Build the exe
        run: pyinstaller --noconfirm --onefile --windowed --name Masterlog --icon assets/icon.ico --add-data "app/ui;ui" --paths app app/main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Masterlog
          path: dist/Masterlog.exe

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/Masterlog.exe dist/GameBacklog.exe   # older builds update themselves from this name
          gh release create "v1.0.${{ github.run_number }}" dist/Masterlog.exe dist/GameBacklog.exe \
            --title "Masterlog v1.0.${{ github.run_number }}" \
            --notes "Already have the app? Click Update in its top bar. New here? Download Masterlog.exe below and run it; no install needed. If Windows SmartScreen warns you, click More info, then Run anyway (the app isn't signed)."
